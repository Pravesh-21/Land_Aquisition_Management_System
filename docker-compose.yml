services:
  # Next.js Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bhudrishti:bhudrishti_pass@db:5432/bhudrishti_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # PostgreSQL + PostGIS Extension Database
  db:
    image: postgis/postgis:15-3.3
    container_name: bhudrishti_postgis
    environment:
      - POSTGRES_USER=bhudrishti
      - POSTGRES_PASSWORD=bhudrishti_pass
      - POSTGRES_DB=bhudrishti_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  # Redis for Celery background tasks & caching
  redis:
    image: redis:7-alpine
    container_name: bhudrishti_redis
    ports:
      - "6379:6379"

volumes:
  postgis_data:
